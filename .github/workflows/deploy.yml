name: CI / CD

# - Pull Request vers main : tests + build de vérification, rien n'est publié
# - Push sur main (après fusion) : tests, build et publication des images sur GHCR
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Une seule exécution à la fois par branche ; une PR mise à jour annule l'exécution précédente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests du backend (pytest)
        run: docker build --target test ./backend

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Vérification des types du frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

  build:
    name: Build${{ github.event_name != 'pull_request' && ' et publication' || '' }} (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: web
            context: ./frontend
          - service: api
            context: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Sur une PR, amd64 suffit pour vérifier que l'image se construit
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/helasch/erally4-${{ matrix.service }}:latest
            ghcr.io/helasch/erally4-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Déploiement en production
    needs: build
    # Jamais sur une PR ; activé seulement si la variable de dépôt DEPLOY_ENABLED vaut "true" (voir DEPLOY.md)
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH et déploiement
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          # docker-compose.yml de ce commit précis
          COMPOSE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.yml
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Empreinte de la clé du serveur (facultatif mais conseillé, voir DEPLOY.md)
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: SERVER_PATH,COMPOSE_URL
          script: |
            set -e
            cd "$SERVER_PATH"

            # Le .env (identifiants de la base) est géré sur le serveur et n'est jamais modifié ici
            if [ ! -f .env ]; then
              echo "Fichier .env absent dans $SERVER_PATH : déploiement annulé."
              exit 1
            fi

            curl -fsSL "$COMPOSE_URL" -o docker-compose.yml.new
            mv docker-compose.yml.new docker-compose.yml

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "Déploiement effectué avec succès"
