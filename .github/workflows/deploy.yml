name: Déploiement du projet

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Un seul déploiement à la fois
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build et publication (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: web
            context: ./frontend
          - service: api
            context: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/helasch/erally4-${{ matrix.service }}:latest
            ghcr.io/helasch/erally4-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Déploiement en production
    needs: build
    # Activé uniquement si la variable de dépôt DEPLOY_ENABLED vaut "true" (voir DEPLOY.md)
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH et déploiement
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          GIT_REPO_URL: https://github.com/${{ github.repository }}.git
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          UMAMI_SITE_ID: ${{ vars.UMAMI_SITE_ID }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SERVER_PATH,GIT_REPO_URL,DB_USER,DB_PASSWORD,SESSION_SECRET,UMAMI_SITE_ID
          script: |
            set -e
            mkdir -p "$(dirname "$SERVER_PATH")"

            if [ ! -d "$SERVER_PATH/.git" ]; then
              echo "Premier déploiement - clonage du repository..."
              git clone "$GIT_REPO_URL" "$SERVER_PATH"
            else
              echo "Mise à jour du projet existant..."
              cd "$SERVER_PATH"
              git fetch origin main
              git reset --hard origin/main
            fi

            cd "$SERVER_PATH"

            # .env généré depuis les secrets GitHub (lisible par l'utilisateur de déploiement uniquement)
            umask 077
            {
              printf "DB_USER='%s'\n" "$DB_USER"
              printf "DB_PASSWORD='%s'\n" "$DB_PASSWORD"
              printf "SESSION_SECRET='%s'\n" "$SESSION_SECRET"
              printf "UMAMI_SITE_ID='%s'\n" "$UMAMI_SITE_ID"
            } > .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "Déploiement effectué avec succès"
