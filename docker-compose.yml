# Production — lancé par la GitHub Action :
#   docker compose up -d --build --remove-orphans
# Les variables ${...} viennent du fichier .env écrit par l'Action à côté de ce fichier.

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  user: "1000:1000"

services:
  web:
    <<: *hardening
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    container_name: erally4-web
    environment:
      - UMAMI_SITE_ID=${UMAMI_SITE_ID:-}
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    depends_on:
      - api
    networks:
      - webproxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erally4.rule=Host(`erally4.devnest.fr`)"
      - "traefik.http.services.erally4.loadbalancer.server.port=3000"
      - "traefik.docker.network=webproxy"

  api:
    <<: *hardening
    build: ./backend
    container_name: erally4-api
    environment:
      - DB_HOST=mariadb-central
      - DB_PORT=3306
      - DB_NAME=erally4
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    tmpfs:
      - /tmp
    volumes:
      - erally4-uploads:/data/uploads
    networks:
      - internal
      - db-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  erally4-uploads:

networks:
  internal:
    internal: true
  webproxy:
    external: true
  db-network:
    external: true
